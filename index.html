    <script>
      // Suppress Vite HMR WebSocket connection errors in iframe preview environment
      window.addEventListener('error', function(event) {
        if (event && (event.message?.includes('WebSocket') || event.filename?.includes('@vite/client'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && (event.reason?.message?.includes('WebSocket') || event.reason?.stack?.includes('@vite/client'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
